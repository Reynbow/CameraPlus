[CameraPlus]
; 0 turns CameraPlus off without uninstalling it.
Enabled=1
; 1 writes extra lines to CameraPlus.log (for bug reports).
Diagnostics=0
; The panel key and the panel button are set on the MODS page (Mod Settings Menu). Without it: PanelKey= a key name
; (F1..F24, a letter, Insert, Home, End...) and PanelButton= a place in the MODS page's button list (15 = D-pad Left).

; Everything you set in the panel (the cameras, the zoom key and button, the idle zoom) is saved in
; CameraPlus.state.ini when the panel closes. That file isn't part of the download, so updating keeps it;
; delete it to start over from the starting styles.
